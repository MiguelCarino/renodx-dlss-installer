; Package manifest for the RenoDX DLSS installer.
; The installer downloads this file at install time, so changes here take effect
; immediately for everyone - no installer rebuild needed.

[Addon]
PackageName=RenoDX DLSS add-on
DownloadUrl64=https://github.com/yumlevi/renodx-dlss-installer/releases/download/latest/renodx-dlss5-v2.5.addon64
EffectInstallPath=.\reshade-shaders\Shaders

[DLLs]
PackageName=DLSS / Streamline DLLs
DownloadUrl=https://github.com/yumlevi/renodx-dlss-installer/releases/download/latest/streamline.zip

; Per-game overrides: add a section named after the game executable, e.g.
;
; [Cyberpunk2077.exe]
; AddonDownloadUrl64=https://github.com/yumlevi/renodx-dlss-installer/releases/download/cp2077/renodx-cp2077.addon64
; DllsDownloadUrl=https://github.com/yumlevi/renodx-dlss-installer/releases/download/cp2077/streamline-cp2077.zip
; SkipAddon=1
; SkipDlls=1
